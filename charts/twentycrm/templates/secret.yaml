apiVersion: v1
kind: Secret
metadata:
  name: twentycrm-app-secrets
  labels:
    app: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
type: Opaque
data:
  # Database configuration
  {{- if .Values.externalDb.enabled }}
  PG_DATABASE_URL: {{ .Values.externalDb.postgresConnectionString | b64enc | quote }}
  {{- else }}
  PG_DATABASE_URL: {{ printf "postgres://%s:%s@twentycrm-db:5432/%s" .Values.db.user .Values.db.password .Values.db.database | b64enc | quote }}
  {{- end }}

  # Redis configuration
  {{- if .Values.externalRedis.enabled }}
  REDIS_URL: {{ .Values.externalRedis.connectionString | b64enc | quote }}
  {{- else }}
  REDIS_URL: {{ printf "redis://twentycrm-redis:6379" | b64enc | quote}}
  {{- end }}

  # Encryption keys (REQUIRED)
  ENCRYPTION_KEY: {{ required ".secrets.encryptionKey is required. Generate with: openssl rand -base64 32" .Values.secrets.encryptionKey | b64enc | quote }}
  {{- if .Values.secrets.fallbackEncryptionKey }}
  FALLBACK_ENCRYPTION_KEY: {{ .Values.secrets.fallbackEncryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.appSecret }}
  APP_SECRET: {{ .Values.secrets.appSecret | b64enc | quote }}
  {{- end }}

  # Additional environment variables
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ printf "%s" $value | b64enc | quote }}
  {{- end }}

