apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app: {{ template "name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}

spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.worker.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ template "name" . }}
      release: {{ .Release.Name }}
      role: worker

  template:
    metadata:
      labels:
        app: {{ template "name" . }}
        release: {{ .Release.Name }}
        role: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      volumes:
      - name: twentycrm-server-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-server-pvc
          
      containers:
      - name: twentycrm-worker
        image: {{ .Values.image }}
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: {{ .Release.Name }}-app-secrets
        env:
        - name: SERVER_URL
          value: "https://{{ .Values.ingress.host }}"
        - name: DISABLE_DB_MIGRATIONS
          value: "true"
        - name: DISABLE_CRON_JOBS_REGISTRATION
          value: "true"

        command:
          - yarn
          - worker:prod
        resources:
          {{- toYaml .Values.worker.resources | indent 12 | printf "\n%s" }}
        volumeMounts:
        - mountPath: /app/packages/twenty-server/.local-storage
          name: twentycrm-server-data

