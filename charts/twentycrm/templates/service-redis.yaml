{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: twentycrm-redis
  labels:
    app: {{ template "name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}

spec:
  internalTrafficPolicy: Cluster
  ports:
  - port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: {{ template "name" . }}
    release: {{ .Release.Name }}
    role: redis
  type: ClusterIP
{{- end }}
