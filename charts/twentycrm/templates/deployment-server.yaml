apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app: {{ template "name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}

spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.server.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ template "name" . }}
      release: {{ .Release.Name }}
      role: server

  template:
    metadata:
      labels:
        app: {{ template "name" . }}
        release: {{ .Release.Name }}
        role: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 1001

      volumes:
      - name: twentycrm-server-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-server-pvc

      initContainers:
        # Wait for database to be ready before starting
        - name: wait-db-ready
          image: postgres:16
          command: 
            - sh
            - -c
            - |
              until pg_isready -h {{ .Release.Name }}-db -p 5432 -U {{ .Values.db.user }}; do
                echo "Waiting for database..."
                sleep 2
              done
          env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-app-secrets
                key: PG_DATABASE_URL

      containers:
      - name: twentycrm-server
        image: {{ .Values.image }}
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: {{ .Release.Name }}-app-secrets

        env:
        - name: NODE_PORT
          value: "3000"
        - name: SERVER_URL
          value: "{{ if .Values.ingress.ssl.enabled }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}"
        - name: DISABLE_DB_MIGRATIONS
          value: "false"
        - name: DISABLE_CRON_JOBS_REGISTRATION
          value: "false"

        ports:
        - containerPort: 3000
          name: http-tcp
          protocol: TCP
        resources:
          {{- toYaml .Values.server.resources | indent 12 | printf "\n%s" }}
        volumeMounts:
        - mountPath: /app/packages/twenty-server/.local-storage
          name: twentycrm-server-data
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
