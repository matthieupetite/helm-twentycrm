{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twentycrm-db
  labels:
    app: {{ template "name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}

spec:
  progressDeadlineSeconds: 600
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate

  selector:
    matchLabels:
      app: {{ template "name" . }}
      release: {{ .Release.Name }}
      role: db
  template:
    metadata:
      labels:
        app: {{ template "name" . }}
        release: {{ .Release.Name }}
        role: db
    spec:
      volumes:
      - name: twentycrm-db-data
        persistentVolumeClaim:
          claimName: twentycrm-db-pvc

      containers:
      - name: twentycrm-db
        image: {{ .Values.db.image }}
        imagePullPolicy: Always
        env:
        - name: POSTGRES_DB
          value: {{ .Values.db.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.db.user | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.db.password | quote }}
        ports:
        - containerPort: 5432
          name: tcp
          protocol: TCP
        resources:
          {{- toYaml .Values.db.resources | indent 12 | printf "\n%s" }}
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: twentycrm-db-data
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - {{ .Values.db.user }}
              - -h
              - localhost
              - -d
              - {{ .Values.db.database }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - {{ .Values.db.user }}
              - -h
              - localhost
              - -d
              - {{ .Values.db.database }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
{{- end }}
