
image: twentycrm/twenty:latest

# A list of env that can be set:
# https://docs.twenty.com/developers/self-host/capabilities/setup
env:
  STORAGE_TYPE: "local"
  SIGN_IN_PREFILLED: "false"
  
  # Optional S3 configuration (uncomment if using S3)
  # STORAGE_S3_REGION: ""
  # STORAGE_S3_NAME: ""
  # STORAGE_S3_ENDPOINT: ""
  # STORAGE_S3_ACCESS_KEY_ID: ""
  # STORAGE_S3_SECRET_ACCESS_KEY: ""

secrets:
  # REQUIRED: Generate with: openssl rand -base64 32
  # WARNING: Losing ENCRYPTION_KEY means losing access to all encrypted secrets in the database
  encryptionKey: ""
  
  # Optional: Set during key rotation (previous ENCRYPTION_KEY)
  # fallbackEncryptionKey: ""
  
  # Legacy APP_SECRET (only for old installs that pre-date ENCRYPTION_KEY)
  # appSecret: ""


server:
  replicas: 1
  storage: 5Gi
  #storageClassName:
  # Storage access mode - use "ReadWriteMany" for HA deployments with multiple replicas
  # Requires RWX-capable storage class (ceph-cephfs, nfs, efs, azurefile, etc.)
  storageAccessMode: "ReadWriteOnce"
  
  # Database migrations and cron jobs for server pods
  disableDbMigrations: false
  disableCronJobsRegistration: false
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"

worker:
  replicas: 1
  
  # Database migrations and cron jobs for worker pods
  # Workers should not run migrations or register cron jobs (server handles this)
  disableDbMigrations: true
  disableCronJobsRegistration: true
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"

db:
  enabled: true
  image: postgres:16
  storage: 5Gi
  #storageClassName:

  # Database password - use a strong password without special characters
  # adminPassword: some-random-string
  
  # Database configuration
  database: default
  user: postgres
  password: postgres

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"

externalDb:
  enabled: false
  postgresConnectionString: "postgres://twenty:twenty@host:5432/twenty"

redis:
  enabled: true
  image: redis:latest
  resources:
    requests:
      memory: "128Mi"
      cpu: "20m"

externalRedis:
  enabled: false
  # Redis connection string format: redis://[username:password@]host:port[/db-number]
  # Examples:
  # - redis://my-redis-host:6379
  # - redis://username:password@my-redis-host:6379/0
  # - redis://my-redis.namespace.svc.cluster.local:6379
  connectionString: "redis://redis-host:6379"
ingress:
  enabled: true
  host: crm.example.com
  class: nginx
  
  # Additional custom annotations (optional)
  annotations: {}
  
  # SSL/TLS Configuration
  ssl:
    enabled: false
    # Cluster issuer for cert-manager (e.g., "letsencrypt-prod", "letsencrypt-staging")
    clusterIssuer: "letsencrypt-prod"
    # TLS secret name (will be auto-generated if using cert-manager)
    secretName: ""
    # Additional TLS hosts (optional, defaults to ingress.host)
    # hosts:
    #   - additional-host.example.com
